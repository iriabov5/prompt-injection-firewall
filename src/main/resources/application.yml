micronaut:
  application:
    name: prompt-injection-firewall
  server:
    port: 8080
  router:
    static-resources:
      swagger:
        enabled: true
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        enabled: true
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

firewall:
  analyzer-timeout-ms: 500
  max-prompt-length: 12000
  review-threshold: 30
  block-threshold: 60

ai:
  enabled: false
  base-url: https://api.openai.com/v1
  api-key: ""
  model: gpt-4o-mini
  timeout-ms: 1000

endpoints:
  health:
    enabled: true
    sensitive: false
