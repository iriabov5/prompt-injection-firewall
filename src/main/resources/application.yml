micronaut:
  application:
    name: prompt-injection-firewall
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3000
            - http://localhost:8080
          allowed-methods:
            - GET
            - POST
            - OPTIONS
          allowed-headers:
            - Content-Type
            - X-API-Key
          exposed-headers:
            - X-Content-Type-Options
            - X-Frame-Options
            - Referrer-Policy
          allow-credentials: false
  router:
    static-resources:
      swagger:
        enabled: true
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        enabled: true
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
  security:
    enabled: true
    reject-not-found: false
    authentication: bearer
    basic-auth:
      enabled: false
    intercept-url-map:
      - pattern: /api/v1/health
        access:
          - isAnonymous()
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
      - pattern: /metrics/**
        access:
          - isAnonymous()
      - pattern: /api/v1/prompts/**
        access:
          - isAuthenticated()
      - pattern: /api/v1/rules
        access:
          - isAuthenticated()
      - pattern: /api/v1/rules/**
        access:
          - isAuthenticated()
      - pattern: /api/v1/audit/**
        access:
          - isAuthenticated()

datasources:
  default:
    enabled: ${AUDIT_ENABLED:false}
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/prompt_firewall`}
    username: ${JDBC_USER:prompt_firewall}
    password: ${JDBC_PASSWORD:prompt_firewall}
    driver-class-name: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: ${AUDIT_ENABLED:false}

firewall:
  analyzer-timeout-ms: 500
  max-prompt-length: 12000
  review-threshold: 30
  block-threshold: 60
  custom-rules:
    max-rules: 100
    max-code-length: 64
    max-pattern-length: 512
    max-description-length: 256

audit:
  enabled: ${AUDIT_ENABLED:false}
  max-page-size: 100

ai:
  enabled: false
  base-url: https://api.openai.com/v1
  api-key: ""
  model: gpt-4o-mini
  timeout-ms: 1000

security:
  api-key:
    enabled: true
    header-name: X-API-Key
    keys:
      - ${PROMPT_FIREWALL_API_KEY:}

endpoints:
  health:
    enabled: true
    sensitive: false
  metrics:
    enabled: true
    sensitive: false
